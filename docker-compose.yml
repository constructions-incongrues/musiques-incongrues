name: flarum

services:
  db:
    image: mariadb:10.11.13
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - 3307:3306
    volumes:
      - db_data:/var/lib/mysql
      - ./etc/mariadb.cnf:/etc/mysql/mariadb.conf.d/99-flarum.cnf:ro
    restart: always
    env_file: .env
    labels:
      # Sans cette étiquette, la sauvegarde copie les fichiers InnoDB d'une base
      # en cours d'écriture — un instantané déchiré, qui restaure peut-être. Avec
      # elle, stack-back produit un vidage SQL cohérent.
      #
      # Le préfixe est `stack-back` : le fork ghcr.io/lawndoc/stack-back a renommé
      # son espace d'étiquettes. Avec `restic-compose-backup.*`, le conteneur
      # démarre, joint le dépôt, et rapporte « No containers for backup found » —
      # il ne sauvegarde rien, et il ne signale pas d'erreur.
      # `mysql` et non `mariadb`, bien que l'image soit MariaDB : le gestionnaire
      # est choisi par les variables d'environnement, pas par l'image. Celui de
      # `mariadb` lit MARIADB_ROOT_PASSWORD / MARIADB_USER / MARIADB_PASSWORD ;
      # ce service n'a que des MYSQL_*, et le vidage plantait sur un mot de passe
      # à None. Même choix que superlarsen-wordpress-db.
      stack-back.mysql: "true"

  flarum:
    image: crazymax/flarum:1.8.10
    depends_on:
      - db
      - redis
    volumes:
      - ./src/flarum/composer.json:/opt/flarum/composer.json
      - ./src/flarum/composer.lock:/opt/flarum/composer.lock
      - ./src/flarum/extend.php:/opt/flarum/extend.php
      - flarum_data:/data
      - flarum_vendor:/opt/flarum/vendor
      - ./src/flarum/emojis:/opt/flarum/public/emojis
      - ./src/flarum/custom:/opt/flarum/public/custom
    environment:
      - DB_HOST=db
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NOPREFIX=true
      - FLARUM_REFERRER_POLICY=strict-origin-when-cross-origin
    restart: always
    env_file: .env
    networks:
      - caddy
      - default
    labels:
      stack-back.volumes: "true"
      caddy: www.musiques-incongrues.net
      caddy.reverse_proxy: "{{upstreams 8000}}"

  phpmyadmin:
    image: phpmyadmin
    restart: always
    env_file: .env
    labels:
      caddy: pma.musiques-incongrues.net
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - caddy
      - default

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.123.11
    restart: always
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.musiques-incongrues.net
      - GENERIC_TIMEZONE=Europe/Paris
      - N8N_DEFAULT_LOCALE=fr-FR
      - N8N_RUNNERS_ENABLED=true
      - N8N_PAYLOAD_SIZE_MAX=268435456 # 256MB
      - NODE_FUNCTION_ALLOW_EXTERNAL=cheerio
    volumes:
      - n8n_data:/home/node/.n8n
      - ./etc/workflows.json:/tmp/workflows.json
    env_file: .env
    labels:
      stack-back.volumes: "true"
      caddy: n8n.musiques-incongrues.net
      caddy.reverse_proxy: "{{upstreams 5678}}"
    networks:
      - caddy
      - default

  s9formatter:
    build:
      context: ./opt/s9formatter-api
      dockerfile: Dockerfile
    env_file: .env
    command: php -S 0.0.0:8020 -t /var/www/html

  redis:
    image: redis:8.2
    restart: always
    volumes:
      - redis_data:/data

  backup:
    # Sauvegarde chiffrée vers Cloudflare R2, tous les jours à 1 h.
    # Les identifiants viennent de .env, que Komodo produit à partir des
    # variables [[MUSIQUES_INCONGRUES_RESTIC_*]] — rien en clair ici.
    image: ghcr.io/lawndoc/stack-back:v1.4.5
    restart: always
    env_file: .env
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      # Volume nommé, et non ./cache : chez superlarsen ce montage fait
      # atterrir le cache restic dans l'arbre de travail git.
      - backup_cache:/cache

networks:
  caddy:
    external: true

volumes:
  db_data: ~
  es_data: ~
  flarum_data: ~
  flarum_vendor: ~
  n8n_data: ~
  redis_data: ~
  backup_cache: ~
